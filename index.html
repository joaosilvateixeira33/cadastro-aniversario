<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro pessoas</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>Cadastro de pessoas</h1>
    </header>
    <main>
        <form class="form js-form">
           <div class="form-control">
                <label for="name">Nome:</label>
                <input 
                    name="name" 
                    type="text"
                    class="form-field js-field-name" 
                    id="name" 
                    minlength="3" 
                    maxlength="120" 
                    pattern="[A-Za-zÀ-ÿ\s]+" 
                    required 
                    oninvalid="this.setCustomValidity('Insira apenas letras neste campo.')"
                    oninput="this.setCustomValidity('')"
                >
           </div>
            <div class="form-control">
                <label for="birth-date">Data de Nascimento:</label>
                <input 
                    type="date"
                    id="birth-date" 
                    name="birth-date" 
                    class="form-field js-field-birthday" 
                    required 
                >
            </div>
            <button type="submit" class="btn-send js-btn-send">Salvar</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Data de Nascimento</th>
                </tr>
            </thead>
            <tbody class="js-table"></tbody>
        </table>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
