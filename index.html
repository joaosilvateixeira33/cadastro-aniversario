<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro pessoas</title>
    <!-- CSS Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white text-center py-4 mb-4 shadow-sm">
        <h1 class="h3 m-0">Cadastro de Pessoas</h1>
    </header>

    <main class="container">
        <div class="row g-4">
            <div class="col-12 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="h5 card-title mb-3">Novo Registro</h2>
                        
                        <form class="js-form">
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Nome (Campo obrigatorio):
                                </label>
                                <input
                                    name="name"
                                    type="text"
                                    class="form-control js-field-name"
                                    id="name"
                                    minlength="3"
                                    maxlength="120"
                                    pattern="[A-Za-zÀ-ÿ\s]+"
                                    placeholder="Ex: Maria Cristina"
                                    required
                                    oninvalid="this.setCustomValidity('Insira apenas letras neste campo.')"
                                    oninput="this.setCustomValidity('')"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="birth-date" class="form-label">
                                    Data de Nascimento (Campo obrigatorio):
                                </label>
                                <input
                                    type="date"
                                    id="birth-date"
                                    name="birth-date"
                                    class="form-control js-field-birthday"
                                    required
                                >
                            </div>

                            <button type="submit" class="btn btn-primary w-100 js-btn-send">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="h5 card-title mb-3">Pessoas Cadastradas</h2>
                        
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th scope="col">Nome</th>
                                        <th scope="col">Data de Nascimento</th>
                                        <th scope="col" class="text-center">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="js-table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
